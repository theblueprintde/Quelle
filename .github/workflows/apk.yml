name: APK hazırla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Quelle.apk

      - name: APK'yı derleme sonucuna ekle
        uses: actions/upload-artifact@v4
        with:
          name: Quelle-apk
          path: Quelle.apk

      - name: Yeni sürüm yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Quelle 0.1.${{ github.run_number }}
          body: Tablete kurmak için aşağıdaki Quelle.apk dosyasını indir.
          files: Quelle.apk
          make_latest: true
